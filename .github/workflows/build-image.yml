# ═══════════════════════════════════════════════════════════════════════════════
# OpenEMR Container Build Pipeline
# Builds linux/amd64 + linux/arm64 natively and pushes a multi-arch manifest
# to Quay.io
# ═══════════════════════════════════════════════════════════════════════════════
#
# Required GitHub Secrets:
#   QUAY_USERNAME - Quay.io robot account (format: username+robotname)
#   QUAY_PASSWORD - Quay.io robot token
#
# Usage:
#   - Manual: Actions → Build and Push OpenEMR → Run workflow
#       gh workflow run "Build and Push OpenEMR" -R ryannix123/openemr-on-openshift
#     Always builds, with no layer cache by default, so every OS and PHP
#     package is fetched fresh. This is the button for "a CVE just dropped".
#   - Daily (6am UTC): builds only if a new upstream OpenEMR release exists
#   - Weekly (Mondays): ALWAYS rebuilds without cache, even if OpenEMR hasn't
#     changed. The image's attack surface is mostly PHP, nginx and the CentOS
#     base -- none of which bump the OpenEMR version when they ship a fix.
#   - On push: Always builds when Containerfile or workflow changes on main
#
# Tags: <version>, <version>-<YYYYMMDD>, latest. The dated tag is immutable,
# so a security rebuild never destroys the previous image you might roll back to.
#
# Architecture:
#   Each architecture builds on its own native runner and pushes by digest,
#   then a merge job joins the digests into one manifest list. Cross-building
#   arm64 on an amd64 runner would mean QEMU, and emulating this image's
#   composer + npm build stages takes roughly an hour and fails unpredictably.
#   ubuntu-24.04-arm is free on public repositories.
# ═══════════════════════════════════════════════════════════════════════════════

name: Build and Push OpenEMR

on:
  workflow_dispatch:
    inputs:
      openemr_version:
        description: 'OpenEMR version to build (e.g., 8.4.0). Leave empty to auto-detect latest.'
        required: false
        default: ''
      fresh:
        description: 'Ignore the build cache and fetch every package fresh (leave on for security rebuilds)'
        type: boolean
        required: false
        default: true

  schedule:
    - cron: '0 6 * * *'    # Daily at 6am UTC: build only on a new OpenEMR release
    - cron: '30 7 * * 1'   # Weekly, Monday 7:30 UTC: forced fresh rebuild for OS/PHP fixes

  push:
    branches: [main]
    paths:
      - 'Containerfile'
      - '.github/workflows/build-image.yml'

env:
  REGISTRY: quay.io
  IMAGE_NAME: ryan_nix/openemr-openshift

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Decide what to build, and whether to build at all
  # ═══════════════════════════════════════════════════════════════════════════
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version_check.outputs.skip }}
      no_cache: ${{ steps.version_check.outputs.no_cache }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Priority:
      #   1. Manual workflow_dispatch input
      #   2. Latest stable tag from upstream
      #   3. Fallback: the Containerfile ARG
      - name: Determine OpenEMR version
        id: version
        run: |
          # --- Option 1: Manual input ---
          if [ -n "${{ inputs.openemr_version }}" ]; then
            VERSION="${{ inputs.openemr_version }}"
            echo "📌 Using manually specified version: ${VERSION}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "### 📦 Build Version: ${VERSION} (manual)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # --- Option 2: Auto-detect latest stable tag from upstream ---
          echo "🔍 Querying OpenEMR GitHub tags for latest stable release..."
          LATEST_TAG=$(curl -sf "https://api.github.com/repos/openemr/openemr/tags?per_page=100" \
            | jq -r '.[].name' \
            | grep -E '^v[0-9]+_[0-9]+_[0-9]+(_[0-9]+)?$' \
            | sed 's/^v//; s/_/./g' \
            | sort -V \
            | tail -1)

          if [ -n "$LATEST_TAG" ]; then
            VERSION="${LATEST_TAG}"
            echo "✅ Latest upstream release detected: ${VERSION}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "### 📦 Build Version: ${VERSION} (auto-detected)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # --- Option 3: Fallback to Containerfile ---
          echo "⚠️  GitHub API query returned no results — falling back to Containerfile"
          VERSION=$(grep -oP 'OPENEMR_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' Containerfile | head -1)
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not determine version from any source"
            exit 1
          fi
          echo "📄 Using version from Containerfile: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "### 📦 Build Version: ${VERSION} (Containerfile fallback)" >> $GITHUB_STEP_SUMMARY

      # Decide whether to build, and whether to bypass the layer cache.
      #
      # The cache matters for security: the dnf layers only rebuild when the
      # lines above them change, so a cached build happily reuses last month's
      # PHP even after Remi ships a fix. Any rebuild that exists to pick up
      # package updates must run with no-cache.
      - name: Decide whether to build
        id: version_check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          EVENT="${{ github.event_name }}"
          SCHEDULE="${{ github.event.schedule }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            FRESH="${{ inputs.fresh }}"
            echo "🔨 Manual run — always building (fresh=${FRESH})"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "no_cache=${FRESH}" >> $GITHUB_OUTPUT
            echo "### 🔨 Manual build (fresh packages: ${FRESH})" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "$EVENT" = "push" ]; then
            # The Containerfile or workflow changed, which already invalidates
            # the affected layers. Cache keeps these builds fast.
            echo "🔨 Push — always building"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "no_cache=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$SCHEDULE" = "30 7 * * 1" ]; then
            echo "🛡️  Weekly security refresh — rebuilding from scratch"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "no_cache=true" >> $GITHUB_OUTPUT
            echo "### 🛡️ Weekly security refresh (no cache)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Daily schedule: only build for a new upstream release.
          echo "no_cache=true" >> $GITHUB_OUTPUT

          TAG_EXISTS=$(curl -sf \
            "https://quay.io/api/v1/repository/${{ env.IMAGE_NAME }}/tag/?specificTag=${VERSION}" \
            | jq -r '.tags | length')

          if [ "$TAG_EXISTS" -gt 0 ]; then
            echo "⏭️  ${VERSION} already in registry — skipping build"
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "### ⏭️ No new release — build skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Current version:** \`${VERSION}\` is already in the registry." >> $GITHUB_STEP_SUMMARY
          else
            echo "🆕 New version ${VERSION} detected — proceeding with build"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # Build each architecture on its own native runner, push by digest
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # Labels only here. Tags are applied once, in the merge job.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # push-by-digest publishes an untagged manifest per architecture. Nothing
      # is reachable by tag until the merge job runs, so a failure on one arch
      # cannot leave :latest pointing at a half-built set.
      #
      # The cache scope is per-arch: a shared scope would have each runner
      # overwrite the other's layers on every run.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENEMR_VERSION=${{ needs.prepare.outputs.version }}
          # Always re-pull the CentOS base, and skip cached layers on security
          # rebuilds so dnf actually fetches current packages.
          pull: true
          no-cache: ${{ needs.prepare.outputs.no_cache == 'true' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # Join the per-arch digests into one tagged manifest list
  # ═══════════════════════════════════════════════════════════════════════════
  merge:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.version }}-{{date 'YYYYMMDD'}}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect the published manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}

      # Report what PHP actually shipped, from the published image. The
      # Containerfile's guard already failed the build on an unpatched PHP;
      # this line makes the answer visible without pulling anything.
      - name: Report shipped PHP version
        id: php
        run: |
          PHP_VER=$(docker run --rm --platform linux/amd64 --entrypoint php \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }} \
            -r 'echo PHP_VERSION;')
          echo "✓ Published image ships PHP ${PHP_VER}"
          echo "version=${PHP_VER}" >> $GITHUB_OUTPUT

      - name: Build summary
        run: |
          echo "### ✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PHP:** ${{ steps.php.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Architectures:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images pushed:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** [quay.io/${{ env.IMAGE_NAME }}](https://${{ env.REGISTRY }}/repository/${{ env.IMAGE_NAME }})" >> $GITHUB_STEP_SUMMARY